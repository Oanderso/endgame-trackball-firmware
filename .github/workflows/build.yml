name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build trackball firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf ccache dfu-util device-tree-compiler wget \
            python3-dev python3-pip python3-setuptools python3-tk python3-wheel xz-utils file \
            make gcc gcc-multilib g++-multilib libsdl2-dev libmagic1

      - name: Install west
        run: |
          python3 -m pip install --user west
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Initialize west workspace
        working-directory: endgame-trackball-config
        run: |
          west init -l config
          west update --fetch-opt=--filter=tree:0

      - name: Install Zephyr Python requirements
        working-directory: endgame-trackball-config
        run: |
          python3 -m pip install --user -r zephyr/scripts/requirements.txt

      - name: Build firmware
        working-directory: endgame-trackball-config
        run: |
          west build -s zmk/app -d build/efogtech_trackball_0 -b efogtech_trackball_0 -- \
            -DZMK_CONFIG="${{ github.workspace }}/endgame-trackball-config/config" \
            -DZMK_EXTRA_MODULES="${{ github.workspace }}/endgame-trackball-config"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: endgame-trackball-config/build/efogtech_trackball_0/zephyr/*.uf2