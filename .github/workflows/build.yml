name: Build ZMK firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build trackball firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git \
            cmake \
            ninja-build \
            gperf \
            ccache \
            dfu-util \
            device-tree-compiler \
            wget \
            python3-dev \
            python3-pip \
            python3-setuptools \
            python3-tk \
            python3-wheel \
            xz-utils \
            file \
            make \
            gcc \
            gcc-multilib \
            g++-multilib \
            libsdl2-dev \
            libmagic1

      - name: Install west
        run: |
          python3 -m pip install --user west
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create west workspace
        run: |
          set -euo pipefail

          mkdir -p zmk-workspace

          # west manifest/config repo
          cp -r endgame-trackball-config/config zmk-workspace/config

          # local zephyr module containing boards/
          cp -r endgame-trackball-config zmk-workspace/endgame-trackball-config

      - name: Initialize west workspace
        working-directory: zmk-workspace
        run: |
          set -euo pipefail

          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

      - name: Verify workspace
        working-directory: zmk-workspace
        run: |
          set -euo pipefail

          west topdir

          test -f zephyr/share/zephyr-package/cmake/ZephyrConfig.cmake
          test -f zmk/app/CMakeLists.txt
          test -f config/west.yml
          test -f endgame-trackball-config/zephyr/module.yml
          test -f endgame-trackball-config/boards/arm/efogtech_trackball_0/efogtech_trackball_0_defconfig

      - name: Install Zephyr Python requirements
        working-directory: zmk-workspace
        run: |
          set -euo pipefail

          python3 -m pip install --user -r zephyr/scripts/requirements.txt

      - name: Build firmware
        working-directory: zmk-workspace
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zmk-workspace/zephyr
        run: |
          set -euo pipefail

          west build \
            -s zmk/app \
            -d build/efogtech_trackball_0 \
            -b efogtech_trackball_0 \
            -- \
            -DZMK_CONFIG="${{ github.workspace }}/zmk-workspace/config" \
            -DZMK_EXTRA_MODULES="${{ github.workspace }}/zmk-workspace/endgame-trackball-config"

      - name: Rename firmware
        run: |
          set -euo pipefail

          mkdir -p firmware

          cp \
            zmk-workspace/build/efogtech_trackball_0/zephyr/*.uf2 \
            firmware/endgame-trackball.uf2

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/*.uf2
          if-no-files-found: error